<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>3270 Mainframe Terminal — Desktop</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3270 MF">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#000000;
    --green:#33ff66;
    --green-dim:#1c8f3d;
    --amber:#ffb000;
    --blue:#5ad1ff;
    --white:#e8ffe8;
    --red:#ff5555;
    --field-bg:#001a00;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; overflow:hidden; background:#000; font-family:'IBM Plex Mono','Consolas','Courier New',monospace; }
  #crt{
    width:100%; max-width:960px; margin:0 auto; background:var(--bg); color:var(--green);
    padding:14px 18px 10px 18px; height:var(--app-vh, 100%); min-height:0; display:flex; flex-direction:column;
    border:2px solid #111; border-radius:6px;
    box-shadow: inset 0 0 60px rgba(51,255,102,0.06), 0 0 30px rgba(0,0,0,0.6);
    position:relative; overflow:hidden;
  }
  #crt::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,0.12) 2px);
    pointer-events:none; mix-blend-mode:multiply;
  }
  /* min-height:0 overrides the flex-item default of min-height:auto, which
     would otherwise force #screen to grow to fit its content and push
     #cmdline/#pfbar off the bottom of the window -- flex:1 + min-height:0
     is what makes overflow-y:auto actually scroll *inside* this box
     instead of the whole page scrolling and hiding the PF keys below it. */
  #screen{
    flex:1; min-height:0; white-space:pre-wrap; font-size:13.5px; line-height:1.33; letter-spacing:0.4px;
    text-shadow:0 0 3px rgba(51,255,102,0.55); overflow-y:auto;
  }
  .amber{color:var(--amber); text-shadow:0 0 3px rgba(255,176,0,0.55);}
  .blue{color:var(--blue); text-shadow:0 0 3px rgba(90,209,255,0.55);}
  .white{color:var(--white); text-shadow:0 0 3px rgba(232,255,232,0.55);}
  .red{color:var(--red); text-shadow:0 0 3px rgba(255,85,85,0.55);}
  .dim{color:var(--green-dim);}
  #cmdline{ display:flex; flex-wrap:wrap; align-items:center; border-top:1px solid #113311; padding-top:6px; margin-top:6px; gap:6px; }
  #prompt{color:var(--amber);}
  #cmdinput{
    flex:1; min-width:80px; background:transparent; border:none; outline:none; color:var(--white);
    font-family:inherit; font-size:14px; text-shadow:0 0 3px rgba(232,255,232,0.55); letter-spacing:0.5px;
  }
  #pfbar{ display:flex; flex-wrap:wrap; gap:4px; padding:8px 0 2px 0; border-top:1px solid #113311; margin-top:6px; }
  .pfkey{
    background:#001a00; border:1px solid var(--green-dim); color:var(--green); font-family:inherit;
    font-size:11px; padding:4px 7px; border-radius:3px; cursor:pointer;
  }
  .pfkey:hover{background:#0a3a0a;}
  /* findNextBtn's label is CSS-generated content (not a real text node) so
     window.find() never matches the button itself while repeating a search. */
  #findNextBtn::after{ content: attr(data-label); }
  #editArea{
    width:100%; flex:1; min-height:400px; background:#000; color:var(--white);
    border:1px solid var(--green-dim); font-family:inherit; font-size:13px; line-height:1.3;
    padding:6px; resize:none; outline:none; text-shadow:0 0 3px rgba(232,255,232,0.4);
  }
  .ispf-field{
    background:var(--field-bg); border:1px solid var(--green-dim); color:var(--white);
    font-family:inherit; font-size:13.5px; letter-spacing:0.4px; padding:0 2px; outline:none;
    text-shadow:0 0 3px rgba(232,255,232,0.4);
  }
  .ispf-field:focus{ border-color:var(--amber); box-shadow:0 0 4px rgba(255,176,0,0.5); }
  ::selection{background:var(--green); color:#000;}
  #screen::-webkit-scrollbar{width:8px;}
  #screen::-webkit-scrollbar-thumb{background:var(--green-dim); border-radius:4px;}
  .hdr{display:flex; justify-content:space-between; color:var(--green-dim); font-size:12px; margin-bottom:4px;}

  /* Mobile / PWA standalone adjustments */
  html,body{ overscroll-behavior:none; }
  #crt{
    padding-top: max(14px, env(safe-area-inset-top));
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(18px, env(safe-area-inset-left));
    padding-right: max(18px, env(safe-area-inset-right));
  }
  .pfkey{ padding:8px 10px; font-size:12px; } /* larger touch targets than the desktop default */
  #cmdinput{ font-size:16px; } /* avoids auto-zoom-on-focus on some mobile browsers */
  @media (max-width: 480px){
    #crt{ border-radius:0; border-width:0; height:var(--app-vh, 100dvh); }
    #screen{ font-size:12.5px; }
    .hdr{ font-size:10.5px; }
  }
</style>
</head>
<body>
<div id="crt">
  <div class="hdr"><span id="hdrLeft">z/OS 3270 EMULATOR</span><span id="hdrRight"></span></div>
  <div id="screen"></div>
  <textarea id="editArea" style="display:none;" spellcheck="false"></textarea>
  <div id="cmdline">
    <span id="prompt">===&gt;</span>
    <input id="cmdinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="" />
    <button id="findNextBtn" class="pfkey" style="display:none;" title="Repeat last find (like ISPF PF5/RFIND)" data-label="PF5 NEXT"></button>
    <button id="downloadBtn" class="pfkey" title="Download a member or dataset to a local file">DOWNLOAD</button>
    <button id="uploadBtn" class="pfkey" title="Load a local text file into a member or dataset">UPLOAD</button>
  </div>
  <div id="pfbar"></div>
  <input type="file" id="importFileInput" accept=".json" style="display:none;" />
  <input type="file" id="uploadFileInput" accept=".txt,text/plain" style="display:none;" />
</div>

<script>
(function(){

// =====================================================================
// ---------------------------- REXX ENGINE ----------------------------
// Real (subset) REXX interpreter: SAY, assignment, IF/THEN/ELSE, DO loops
// (range/WHILE/FOREVER/count), SELECT/WHEN, LEAVE/ITERATE, ARG/PULL/PARSE,
// EXIT/RETURN, arithmetic + string functions, compound (stem) variables,
// and ADDRESS TSO host-command support (ALLOC/FREE/EXECIO/etc via a
// pluggable hostCommandHandler) so REXX execs can genuinely read & write
// datasets, matching real TSO/REXX idioms.
// =====================================================================
function Rexx(program, opts){
  opts = opts || {};
  this.output = [];
  this.vars = {};
  this.argString = opts.argString || '';
  this.inputQueue = (opts.inputQueue || []).slice();
  this.rc = 0;
  this.print = (s)=>this.output.push(s);
  this.maxSteps = 200000;
  this.steps = 0;
  this.program = program;
  this.address = 'TSO';
  this.hostCommandHandler = opts.hostCommandHandler || null;
  this.allocs = opts.initialAllocs ? Object.assign({}, opts.initialAllocs) : {};
  this.cursors = {}; // DB2 cursor state: name -> {sql, rows, columns, pos, open}
}
Rexx.prototype.run = function(){
  try{
    const lines = this.preprocess(this.program);
    this.flatLines = lines;
    // Labels (a lone "NAME:" clause) are CALL/internal-routine landing points.
    // They're not block boundaries -- normal sequential execution just falls
    // through them, exactly like real REXX -- so this is purely a lookup
    // table for the 'call' statement, built once up front.
    this.labels = {};
    lines.forEach((clause, idx)=>{
      const lm = clause.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:$/);
      if(lm) this.labels[lm[1].toUpperCase()] = idx;
    });
    const {stmts} = this.parseBlock(lines, 0, lines.length);
    this.exec(stmts);
  }catch(e){
    if(e && e.__rexxExit){ /* normal exit */ }
    else if(e && e.__rexxReturn){ if(typeof e.value==='number' && Number.isFinite(e.value)) this.rc = e.value; }
    else{ this.output.push('*** REXX ERROR: ' + (e.message||e)); this.rc = this.rc || 12; }
  }
  return {output:this.output, rc:this.rc, vars:this.vars};
};
Rexx.prototype.preprocess = function(src){
  let s = src.replace(/\/\*[\s\S]*?\*\//g,' ');
  const rawLines = s.split(/\r?\n/);
  let joined=[]; let buf='';
  for(let raw of rawLines){
    let trimmed = raw.trim();
    buf = buf ? buf + ' ' + trimmed : trimmed;
    if(buf.endsWith(',')){ buf = buf.slice(0,-1)+' '; continue; }
    joined.push(buf); buf='';
  }
  if(buf) joined.push(buf);
  let clauses=[];
  for(let line of joined){
    if(!line.trim()) continue;
    let parts = this.splitRespectingQuotes(line, ';');
    for(let p of parts){ const t=p.trim(); if(t) clauses.push(t); }
  }
  return clauses;
};
Rexx.prototype.splitRespectingQuotes = function(str, sep){
  let out=[]; let cur=''; let q=null;
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(q){ cur+=c; if(c===q) q=null; }
    else if(c==='"'||c==="'"){ q=c; cur+=c; }
    else if(c===sep){ out.push(cur); cur=''; }
    else cur+=c;
  }
  if(cur.trim()!==''||out.length===0) out.push(cur);
  return out;
};
Rexx.prototype.firstWord = function(clause){ const m=clause.match(/^\s*([^\s]+)/); return m? m[1].toUpperCase():''; };
Rexx.prototype.parseBlock = function(lines,start,end){
  let stmts=[]; let i=start;
  while(i<end){
    const clause=lines[i]; const kw=this.firstWord(clause);
    if(kw==='END') return {stmts,next:i};
    if(kw==='ELSE') return {stmts,next:i};
    const parsed=this.parseOne(lines,i,end);
    stmts.push(parsed.stmt); i=parsed.next;
  }
  return {stmts,next:i};
};
Rexx.prototype.parseOne = function(lines,i,end){
  const clause=lines[i];
  const labelMatch = clause.trim().match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:$/);
  if(labelMatch) return {stmt:{type:'label', name:labelMatch[1]}, next:i+1};
  const kw=this.firstWord(clause); const rest=clause.slice(kw.length).trim();
  if(kw==='SAY') return {stmt:{type:'say',expr:rest}, next:i+1};
  if(kw==='EXIT') return {stmt:{type:'exit',expr:rest}, next:i+1};
  if(kw==='RETURN') return {stmt:{type:'return',expr:rest}, next:i+1};
  if(kw==='CALL'){
    const cm = rest.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*(.*)$/);
    if(cm) return {stmt:{type:'call', labelName:cm[1], argsExpr:cm[2]}, next:i+1};
    return {stmt:{type:'nop'}, next:i+1};
  }
  if(kw==='PROCEDURE') return {stmt:{type:'nop'}, next:i+1}; // internal routines share the caller's variables (no EXPOSE scoping in this subset)
  if(kw==='QUEUE') return {stmt:{type:'queue', expr:rest}, next:i+1};
  if(kw==='PUSH') return {stmt:{type:'push', expr:rest}, next:i+1};
  if(kw==='ARG') return {stmt:{type:'arg',names:rest.split(/\s+/).filter(Boolean)}, next:i+1};
  if(kw==='PULL') return {stmt:{type:'pull',names:rest.split(/\s+/).filter(Boolean)}, next:i+1};
  if(kw==='PARSE'){
    const r2=rest.trim(); const kw2=r2.split(/\s+/)[0].toUpperCase();
    if(kw2==='ARG') return {stmt:{type:'arg',names:r2.slice(3).trim().split(/\s+/).filter(Boolean)}, next:i+1};
    if(kw2==='PULL') return {stmt:{type:'pull',names:r2.slice(4).trim().split(/\s+/).filter(Boolean)}, next:i+1};
    if(kw2==='VALUE'){
      const withIdx=r2.toUpperCase().indexOf(' WITH ');
      const exprPart=r2.slice(6, withIdx>=0?withIdx:undefined).trim();
      const namesPart= withIdx>=0? r2.slice(withIdx+6).trim():'';
      return {stmt:{type:'parsevalue',expr:exprPart,names:namesPart.split(/\s+/).filter(Boolean)}, next:i+1};
    }
    return {stmt:{type:'nop'}, next:i+1};
  }
  if(kw==='LEAVE') return {stmt:{type:'leave'}, next:i+1};
  if(kw==='ITERATE') return {stmt:{type:'iterate'}, next:i+1};
  if(kw==='NOP') return {stmt:{type:'nop'}, next:i+1};
  if(kw==='DO') return this.parseDo(lines,i,end,rest);
  if(kw==='IF') return this.parseIf(lines,i,end,rest);
  if(kw==='SELECT') return this.parseSelect(lines,i,end);
  if(kw==='ADDRESS') return {stmt:{type:'address', env: rest.trim()}, next:i+1};
  const am = clause.match(/^([A-Za-z_][A-Za-z0-9_.!?]*)\s*=\s*(.*)$/);
  if(am) return {stmt:{type:'assign',name:am[1],expr:am[2]}, next:i+1};
  // Any clause that's not a recognized keyword instruction or assignment is,
  // per real REXX semantics, a command sent to the current ADDRESS environment.
  return {stmt:{type:'hostcmd', expr: clause}, next:i+1};
};
Rexx.prototype.parseDo = function(lines,i,end,rest){
  let doSpec; const r=rest.trim(); const rU=r.toUpperCase();
  if(rU.startsWith('WHILE')) doSpec={kind:'while',cond:r.slice(5).trim()};
  else if(rU==='FOREVER'||rU==='') doSpec={kind: r===''?'once':'forever'};
  else{
    const m=r.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s+TO\s+(.+?)(\s+BY\s+(.+))?$/i);
    if(m) doSpec={kind:'range',varName:m[1],start:m[2],end:m[3],step:m[5]||'1'};
    else doSpec={kind:'count',count:r};
  }
  const body=this.parseBlock(lines,i+1,end);
  let next=body.next;
  if(this.firstWord(lines[next]||'')==='END') next=next+1;
  return {stmt:{type:'do',spec:doSpec,body:body.stmts}, next};
};
// Shared by IF...THEN/ELSE and SELECT's WHEN...THEN: `remainder` is
// whatever text follows the keyword on the same line. Blank means the
// body is the next clause; "DO ..." means a real multi-line DO block
// starts right here (its body continues on subsequent lines, closed by
// END, exactly like any other DO -- this is the common "THEN DO ... END"
// idiom, which a naive single-line-only parse silently mangles); anything
// else is a single inline statement.
Rexx.prototype.parseInlineOrBlock = function(lines, i, end, remainder){
  if(!remainder) return this.parseOne(lines, i+1, end);
  const kw = remainder.split(/\s+/)[0].toUpperCase();
  if(kw==='DO') return this.parseDo(lines, i, end, remainder.slice(2).trim());
  const sub = this.parseOne([remainder], 0, 1);
  return {stmt: sub.stmt, next: i+1};
};
Rexx.prototype.parseIf = function(lines,i,end,rest){
  const thenIdx=rest.toUpperCase().indexOf(' THEN');
  let cond,remainder;
  if(thenIdx>=0){ cond=rest.slice(0,thenIdx).trim(); remainder=rest.slice(thenIdx+5).trim(); }
  else{ cond=rest.trim(); remainder=''; }
  const thenParsed = this.parseInlineOrBlock(lines, i, end, remainder);
  const thenStmt = thenParsed.stmt; let next = thenParsed.next;
  let elseStmt=null;
  if(this.firstWord(lines[next]||'')==='ELSE'){
    const elseClause=lines[next]; const elseRest=elseClause.slice(4).trim();
    const elseParsed = this.parseInlineOrBlock(lines, next, end, elseRest);
    elseStmt = elseParsed.stmt; next = elseParsed.next;
  }
  return {stmt:{type:'if',cond,then:thenStmt,else:elseStmt}, next};
};
Rexx.prototype.parseSelect = function(lines,i,end){
  let i2=i+1; let whens=[]; let otherwise=[];
  while(i2<end){
    const kw=this.firstWord(lines[i2]);
    if(kw==='END'){ i2++; break; }
    if(kw==='WHEN'){
      const rest=lines[i2].slice(4).trim();
      const thenIdx=rest.toUpperCase().indexOf(' THEN');
      const cond= thenIdx>=0? rest.slice(0,thenIdx).trim():rest;
      const remainder= thenIdx>=0? rest.slice(thenIdx+5).trim():'';
      const whenParsed = this.parseInlineOrBlock(lines, i2, end, remainder);
      whens.push({cond, stmt: whenParsed.stmt}); i2 = whenParsed.next;
    } else if(kw==='OTHERWISE'){
      const p=this.parseBlock(lines,i2+1,end); otherwise=p.stmts; i2=p.next;
    } else i2++;
  }
  return {stmt:{type:'select',whens,otherwise}, next:i2};
};
const LEAVE=Symbol('leave'), ITERATE=Symbol('iterate');
Rexx.prototype.exec = function(stmts){
  for(const st of stmts){ const sig=this.execOne(st); if(sig===LEAVE||sig===ITERATE) return sig; }
  return null;
};
Rexx.prototype.execOne = function(st){
  this.steps++;
  if(this.steps>this.maxSteps) throw new Error('step limit exceeded (possible infinite loop)');
  switch(st.type){
    case 'nop': case 'unknown': return null;
    case 'address': { this.address = (st.env||'').toUpperCase(); return null; }
    case 'hostcmd': {
      const text = this.evalToString(st.expr);
      if(typeof this.hostCommandHandler === 'function'){
        const res = this.hostCommandHandler(text, this.address, this) || {};
        this.vars['RC'] = res.rc !== undefined ? res.rc : 0;
        if(res.output) res.output.forEach(o=>this.print(o));
        if(res.setVars) Object.keys(res.setVars).forEach(k=>{ this.vars[k.toUpperCase()] = res.setVars[k]; });
      } else { this.vars['RC'] = 0; }
      return null;
    }
    case 'say': this.print(this.evalToString(st.expr)); return null;
    case 'assign': this.vars[this.resolveName(st.name)] = this.evalExpr(st.expr); return null;
    case 'exit': {
      const v = st.expr? this.evalExpr(st.expr):'';
      if(typeof v==='number' && Number.isFinite(v)) this.rc = v;
      const e=new Error('exit'); e.__rexxExit=true; throw e;
    }
    case 'label': return null; // just a landing point for CALL; falls through otherwise
    case 'return': {
      const v = st.expr? this.evalExpr(st.expr):'';
      const e=new Error('return'); e.__rexxReturn=true; e.value=v; throw e;
    }
    case 'call': {
      const labelU = st.labelName.toUpperCase();
      const idx = this.labels[labelU];
      if(idx===undefined) throw new Error('label not found for CALL: ' + st.labelName);
      const argVal = st.argsExpr ? this.evalToString(st.argsExpr) : '';
      const savedArgString = this.argString;
      this.argString = argVal;
      let returnValue = '';
      try{
        const {stmts} = this.parseBlock(this.flatLines, idx+1, this.flatLines.length);
        this.exec(stmts);
      }catch(e){
        if(e && e.__rexxReturn){ returnValue = e.value!==undefined? e.value : ''; }
        else { this.argString = savedArgString; throw e; }
      }
      this.argString = savedArgString;
      this.vars['RESULT'] = returnValue;
      return null;
    }
    case 'queue': this.inputQueue.push(this.evalToString(st.expr)); return null; // adds to the bottom
    case 'push': this.inputQueue.unshift(this.evalToString(st.expr)); return null; // adds to the top
    case 'arg': {
      const parts = this.argString.trim().length? this.argString.trim().split(/\s+/):[];
      st.names.forEach((nm,idx)=>{ this.vars[nm.toUpperCase()] = parts[idx]!==undefined? parts[idx]:''; });
      return null;
    }
    case 'pull': {
      st.names.forEach((nm)=>{ const v=this.inputQueue.length? this.inputQueue.shift():''; this.vars[nm.toUpperCase()]=String(v).toUpperCase(); });
      return null;
    }
    case 'parsevalue': {
      const val=String(this.evalExpr(st.expr)); const parts=val.trim().split(/\s+/);
      st.names.forEach((nm,idx)=>{ this.vars[nm.toUpperCase()] = parts[idx]!==undefined? parts[idx]:''; });
      return null;
    }
    case 'if': {
      if(this.truthy(this.evalExpr(st.cond))) return this.execOne(st.then);
      else if(st.else) return this.execOne(st.else);
      return null;
    }
    case 'select': {
      for(const w of st.whens){ if(this.truthy(this.evalExpr(w.cond))) return this.execOne(w.stmt); }
      return this.exec(st.otherwise);
    }
    case 'do': return this.execDo(st);
    case 'leave': return LEAVE;
    case 'iterate': return ITERATE;
    default: return null;
  }
};
Rexx.prototype.execDo = function(st){
  const spec=st.spec;
  if(spec.kind==='once'){ this.exec(st.body); return null; }
  if(spec.kind==='range'){
    let cur=this.toNumber(this.evalExpr(spec.start));
    const endV=this.toNumber(this.evalExpr(spec.end));
    const step=this.toNumber(this.evalExpr(spec.step));
    while((step>=0 && cur<=endV) || (step<0 && cur>=endV)){
      this.vars[spec.varName.toUpperCase()]=cur;
      const sig=this.exec(st.body);
      if(sig===LEAVE) break;
      cur+=step;
    }
    return null;
  }
  if(spec.kind==='count'){
    let n=this.toNumber(this.evalExpr(spec.count));
    for(let k=0;k<n;k++){ const sig=this.exec(st.body); if(sig===LEAVE) break; }
    return null;
  }
  if(spec.kind==='while'){
    let guard=0;
    while(this.truthy(this.evalExpr(spec.cond))){
      if(++guard>this.maxSteps) throw new Error('loop guard exceeded');
      const sig=this.exec(st.body); if(sig===LEAVE) break;
    }
    return null;
  }
  if(spec.kind==='forever'){
    let guard=0;
    while(true){
      if(++guard>this.maxSteps) throw new Error('loop guard exceeded');
      const sig=this.exec(st.body); if(sig===LEAVE) break;
    }
    return null;
  }
  return null;
};
Rexx.prototype.evalToString = function(expr){ return this.toStr(this.evalExpr(expr)); };
Rexx.prototype.toStr = function(v){
  if(v===undefined||v===null) return '';
  if(typeof v==='number'){ if(Number.isInteger(v)) return String(v); let s=String(Math.round(v*1e6)/1e6); return s; }
  return String(v);
};
Rexx.prototype.toNumber = function(v){ if(typeof v==='number') return v; const n=parseFloat(v); return isNaN(n)?0:n; };
Rexx.prototype.truthy = function(v){ const s=this.toStr(v).trim(); return s==='1' || s.toUpperCase()==='TRUE'; };
Rexx.prototype.resolveName = function(name){
  if(name.indexOf('.')===-1) return name.toUpperCase();
  const parts=name.split('.'); const stem=parts[0].toUpperCase();
  const tail=parts.slice(1).map(seg=>{
    if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(seg)) return this.toStr(this.lookupSimple(seg));
    return seg;
  });
  return stem + '.' + tail.join('.');
};

// =====================================================================
// ------------------------------- DB2 ENGINE ----------------------------
// Minimal in-memory SQL engine simulating a DB2 subsystem: CREATE/DROP
// TABLE, INSERT, SELECT (WHERE + ORDER BY, AND-chained comparisons),
// UPDATE, DELETE. Returns {sqlcode, message, rows, columns, rowsAffected}
// using real-ish DB2 SQLCODEs (0 ok, 100 not found, -204 undefined name,
// -601 already exists, -811 singleton-select multi-row, etc).

function DB2Engine(tables){ this.tables = tables || {}; }

    if(q){ cur+=c; if(c===q) q=null; continue; }
    if(c==="'"||c==='"'){ q=c; cur+=c; continue; }
    if(c==='(') depth++;
    if(c===')') depth--;

  }

    const rhsIsColumnRef = new RegExp('^' + COL + '$').test(rhsRaw) && !/^-?\d+(\.\d+)?$/.test(rhsRaw) && row[rhsRaw.toUpperCase()]!==undefined;
    const val = rhsIsColumnRef ? row[rhsRaw.toUpperCase()] : this.parseValue(rhsRaw);
    return this.compareVals(row[col.toUpperCase()], val, op);
  }
  return false;
};
// FROM clause: a single table, or "T1 [alias] [INNER] JOIN T2 [alias] ON cond"
// (one join level -- a deliberate subset, not full chained multi-way joins).
// Rows come back "qualified": each column is reachable both unqualified
// (COL) and table/alias-qualified (ALIAS.COL, TABLE.COL) for JOIN ON and SELECT.
DB2Engine.prototype.qualifyRow = function(parts){
  const row = {};
  parts.forEach(p=>{
    p.columns.forEach(c=>{
      row[c.name] = p.row[c.name];
      row[p.alias+'.'+c.name] = p.row[c.name];
      if(p.name!==p.alias) row[p.name+'.'+c.name] = p.row[c.name];
    });
  });
  return row;
};
DB2Engine.prototype.evalFrom = function(fromClause){
  const joinM = fromClause.match(/^(.*?)\b(?:INNER\s+JOIN|JOIN)\b(.*?)\bON\b(.*)$/is);
  if(!joinM){
    const baseM = fromClause.trim().match(/^([A-Za-z_][A-Za-z0-9_.]*)\s*([A-Za-z_][A-Za-z0-9_]*)?$/);
    if(!baseM){ this._lastFromError='SYNTAX ERROR IN FROM CLAUSE'; return {baseRows:null}; }
    const tblName=baseM[1].toUpperCase(); const alias=(baseM[2]||tblName).toUpperCase();
    const tbl=this.tables[tblName];
    if(!tbl){ this._lastFromError=tblName+' IS AN UNDEFINED NAME'; return {baseRows:null}; }
    const rows = tbl.rows.map(r=>this.qualifyRow([{alias, name:tblName, columns:tbl.columns, row:r}]));
    return {baseRows: rows, tableColumnsMap: tbl.columns.map(c=>c.name)};
  }
  const leftSpec=joinM[1].trim(), rightSpec=joinM[2].trim(), onCond=joinM[3].trim();
  const leftM = leftSpec.match(/^([A-Za-z_][A-Za-z0-9_.]*)\s*([A-Za-z_][A-Za-z0-9_]*)?$/);
  const rightM = rightSpec.match(/^([A-Za-z_][A-Za-z0-9_.]*)\s*([A-Za-z_][A-Za-z0-9_]*)?$/);
  if(!leftM || !rightM){ this._lastFromError='SYNTAX ERROR IN JOIN'; return {baseRows:null}; }
  const leftName=leftM[1].toUpperCase(), leftAlias=(leftM[2]||leftName).toUpperCase();
  const rightName=rightM[1].toUpperCase(), rightAlias=(rightM[2]||rightName).toUpperCase();
  const leftTbl=this.tables[leftName], rightTbl=this.tables[rightName];
  if(!leftTbl){ this._lastFromError=leftName+' IS AN UNDEFINED NAME'; return {baseRows:null}; }
  if(!rightTbl){ this._lastFromError=rightName+' IS AN UNDEFINED NAME'; return {baseRows:null}; }
  const rows=[];
  leftTbl.rows.forEach(lr=>{
    rightTbl.rows.forEach(rr=>{
      const candidate = this.qualifyRow([
        {alias:leftAlias, name:leftName, columns:leftTbl.columns, row:lr},
        {alias:rightAlias, name:rightName, columns:rightTbl.columns, row:rr},
      ]);
      if(this.evalCond(candidate, onCond)) rows.push(candidate);
    });
  });
  const flatColumns=[]; leftTbl.columns.concat(rightTbl.columns).forEach(c=>{ if(!flatColumns.includes(c.name)) flatColumns.push(c.name); });
  return {baseRows: rows, tableColumnsMap: flatColumns};
};
DB2Engine.prototype.parseColSpec = function(colText){
  let text = colText.trim(); let alias = null;
  const aliasM = text.match(/^(.*?)\s+AS\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i);
  if(aliasM){ text = aliasM[1].trim(); alias = aliasM[2].toUpperCase(); }
  const aggM = text.match(/^(COUNT|SUM|AVG|MIN|MAX)\s*\(\s*(.*?)\s*\)$/i);
  if(aggM){
    const agg = aggM[1].toUpperCase();
    const inner = aggM[2].trim();
    const col = inner==='*' ? null : inner.replace(/^[A-Za-z_][A-Za-z0-9_]*\./,'').toUpperCase();
    return {agg, col, alias};
  }
  const col = text.replace(/^[A-Za-z_][A-Za-z0-9_]*\./,'').toUpperCase();
  return {col, alias};
};
DB2Engine.prototype.computeAgg = function(agg, col, rows){
  if(agg==='COUNT') return col? rows.filter(r=>r[col]!==undefined && r[col]!==null).length : rows.length;
  const nums = rows.map(r=>Number(r[col])).filter(v=>!isNaN(v));
  if(agg==='SUM') return nums.reduce((a,b)=>a+b,0);
  if(agg==='AVG') return nums.length? nums.reduce((a,b)=>a+b,0)/nums.length : null;
  if(agg==='MIN') return nums.length? Math.min(...nums) : null;
  if(agg==='MAX') return nums.length? Math.max(...nums) : null;
  return null;
};
DB2Engine.prototype.execSelect = function(sql){
  let rest = sql.slice(6).trim(); // after "SELECT"
  let distinct = false;
  if(/^DISTINCT\s+/i.test(rest)){ distinct = true; rest = rest.replace(/^DISTINCT\s+/i,''); }

  let orderClause=null, groupClause=null, whereClause=null;
  let om = rest.match(/\bORDER\s+BY\b/i);
  if(om){ orderClause = rest.slice(om.index+om[0].length).trim(); rest = rest.slice(0, om.index); }
  let gm = rest.match(/\bGROUP\s+BY\b/i);
  if(gm){ groupClause = rest.slice(gm.index+gm[0].length).trim(); rest = rest.slice(0, gm.index); }
  let wm = rest.match(/\bWHERE\b/i);
  if(wm){ whereClause = rest.slice(wm.index+wm[0].length).trim(); rest = rest.slice(0, wm.index); }
  const fm = rest.match(/\bFROM\b/i);
  if(!fm) return {sqlcode:-104, message:'SYNTAX ERROR IN SELECT'};
  const colsRaw = rest.slice(0, fm.index).trim();
  const fromClause = rest.slice(fm.index+4).trim();

  const {baseRows, tableColumnsMap} = this.evalFrom(fromClause);
  if(baseRows===null) return {sqlcode:-204, message: this._lastFromError};

  let rows = whereClause? baseRows.filter(r=>this.evalCond(r, whereClause)) : baseRows;
  const colSpecs = colsRaw==='*' ? [{star:true}] : this.splitTopLevel(colsRaw, ',').map(c=>this.parseColSpec(c));
  const hasAgg = colSpecs.some(c=>c.agg);

  let outColumns, outRows;
  if(groupClause || hasAgg){
    const groupCols = groupClause? this.splitTopLevel(groupClause, ',').map(c=>c.trim().replace(/^[A-Za-z_][A-Za-z0-9_]*\./,'').toUpperCase()) : [];
    const groups = new Map();
    rows.forEach(r=>{
      const key = groupCols.map(c=>String(r[c])).join('\u0001');
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    if(groups.size===0) groups.set('', []); // aggregate over zero rows still yields one summary row (e.g. COUNT(*)=0)
    outColumns=[]; outRows=[];
    for(const groupRows of groups.values()){
      const outRow={};
      colSpecs.forEach(spec=>{
        const label = spec.alias || (spec.agg? spec.agg+'('+(spec.col||'*')+')' : spec.col);
        if(!outColumns.includes(label)) outColumns.push(label);
        outRow[label] = spec.agg? this.computeAgg(spec.agg, spec.col, groupRows) : (groupRows.length? groupRows[0][spec.col] : null);
      });
      outRows.push(outRow);
    }
  } else if(colSpecs.length===1 && colSpecs[0].star){
    outColumns = tableColumnsMap;
    outRows = rows.map(r=>{ const o={}; outColumns.forEach(c=>o[c]=r[c]); return o; });
  } else {
    outColumns = colSpecs.map(c=>c.alias||c.col);
    outRows = rows.map(r=>{ const o={}; colSpecs.forEach(spec=>{ o[spec.alias||spec.col]=r[spec.col]; }); return o; });
  }

  if(distinct){
    const seen=new Set(); outRows = outRows.filter(r=>{ const k=JSON.stringify(r); if(seen.has(k)) return false; seen.add(k); return true; });
  }
  if(orderClause){
    const orderSpecs = this.splitTopLevel(orderClause, ',').map(o=>{
      const om2 = o.trim().match(/^(\S+)\s*(ASC|DESC)?$/i);
      return {col: (om2? om2[1]:o).replace(/^[A-Za-z_][A-Za-z0-9_]*\./,'').toUpperCase(), desc: om2 && (om2[2]||'').toUpperCase()==='DESC'};
    });
    outRows = outRows.slice().sort((a,b)=>{
      for(const spec of orderSpecs){
        const av=a[spec.col], bv=b[spec.col];
        if(av>bv) return spec.desc?-1:1;
        if(av<bv) return spec.desc?1:-1;
      }
      return 0;
    });
  }
  if(outRows.length===0) return {sqlcode:100, message:'ROW NOT FOUND', rows:[], columns:outColumns};
  return {sqlcode:0, message: outRows.length + ' ROW(S) SELECTED', rows: outRows, columns: outColumns};
};
DB2Engine.prototype.execute = function(sqlRaw){
  const sql = sqlRaw.trim().replace(/;\s*$/,'');
  const upper = sql.toUpperCase();

  if(upper.startsWith('CREATE TABLE')){
    const m = sql.match(/CREATE TABLE\s+([A-Za-z_][A-Za-z0-9_.]*)\s*\((.*)\)\s*$/is);
    if(!m) return {sqlcode:-104, message:'SYNTAX ERROR IN CREATE TABLE'};
    const name=m[1].toUpperCase();
    if(this.tables[name]) return {sqlcode:-601, message:name+' ALREADY EXISTS'};
    const colDefs=this.splitTopLevel(m[2], ',');
    const columns=colDefs.map(cd=>{
      const cm=cd.trim().match(/^([A-Za-z_][A-Za-z0-9_]*)\s+(.+)$/);
      return {name: cm? cm[1].toUpperCase(): cd.toUpperCase(), type: cm? cm[2].trim().toUpperCase():'CHAR'};
    });
    this.tables[name] = {columns, rows:[]};
    return {sqlcode:0, message:'DSNE617I CREATE TABLE ' + name + ' SUCCESSFUL'};
  }
  if(upper.startsWith('DROP TABLE')){
    const name = sql.split(/\s+/)[2].toUpperCase();
    if(!this.tables[name]) return {sqlcode:-204, message:name+' IS AN UNDEFINED NAME'};
    delete this.tables[name];
    return {sqlcode:0, message:'DSNE617I DROP TABLE ' + name + ' SUCCESSFUL'};
  }
  if(upper.startsWith('INSERT INTO')){
    const m = sql.match(/INSERT INTO\s+([A-Za-z_][A-Za-z0-9_.]*)\s*(\(([^)]*)\))?\s*VALUES\s*\((.*)\)\s*$/is);
    if(!m) return {sqlcode:-104, message:'SYNTAX ERROR IN INSERT'};
    const name=m[1].toUpperCase(); const tbl=this.tables[name];
    if(!tbl) return {sqlcode:-204, message:name+' IS AN UNDEFINED NAME'};
    const colNames = m[3]? this.splitTopLevel(m[3], ',').map(c=>c.trim().toUpperCase()) : tbl.columns.map(c=>c.name);
    const vals = this.splitTopLevel(m[4], ',').map(v=>this.parseValue(v));
    if(colNames.length!==vals.length) return {sqlcode:-117, message:'NUMBER OF INSERT VALUES DOES NOT MATCH COLUMNS'};
    const row={}; colNames.forEach((c,i)=>{ row[c]=vals[i]; });
    tbl.rows.push(row);
    return {sqlcode:0, message:'1 ROW INSERTED', rowsAffected:1};
  }
  if(upper.startsWith('SELECT')) return this.execSelect(sql);
  if(upper.startsWith('UPDATE')){
    const m = sql.match(/UPDATE\s+([A-Za-z_][A-Za-z0-9_.]*)\s+SET\s+(.*?)\s*(WHERE\s+(.*))?$/is);
    if(!m) return {sqlcode:-104, message:'SYNTAX ERROR IN UPDATE'};
    const name=m[1].toUpperCase(); const tbl=this.tables[name];
    if(!tbl) return {sqlcode:-204, message:name+' IS AN UNDEFINED NAME'};
    const assigns = this.splitTopLevel(m[2], ',').map(a=>{
      const am=a.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
      return {col:am[1].toUpperCase(), exprText:am[2]};
    });
    const whereClause=m[4]; let count=0;
    tbl.rows.forEach(r=>{ if(this.evalCond(r, whereClause)){ assigns.forEach(a=>{ r[a.col]=this.evalSqlExpr(r, a.exprText); }); count++; } });
    return {sqlcode: count===0?100:0, message: count+' ROW(S) UPDATED', rowsAffected:count};
  }
  if(upper.startsWith('DELETE FROM') || upper.startsWith('DELETE ')){
    const m = sql.match(/DELETE FROM\s+([A-Za-z_][A-Za-z0-9_.]*)\s*(WHERE\s+(.*))?$/is);
    if(!m) return {sqlcode:-104, message:'SYNTAX ERROR IN DELETE'};
    const name=m[1].toUpperCase(); const tbl=this.tables[name];
    if(!tbl) return {sqlcode:-204, message:name+' IS AN UNDEFINED NAME'};
    const whereClause=m[3]; const before=tbl.rows.length;
    tbl.rows = tbl.rows.filter(r=>!this.evalCond(r, whereClause));
    const count = before - tbl.rows.length;
    return {sqlcode: count===0?100:0, message: count+' ROW(S) DELETED', rowsAffected:count};
  }
  return {sqlcode:-199, message:'UNSUPPORTED SQL STATEMENT: ' + sql.split(/\s+/)[0]};
};

// ADDRESS DB2 / EXECSQL host-command handler with cursor support (DECLARE/OPEN/FETCH/CLOSE),
// singleton SELECT...INTO, and pass-through for INSERT/UPDATE/DELETE/CREATE/DROP.
function makeDB2HostCommandHandler(db2engine){
  return function db2HostCommandHandler(cmd, address, rexx){
    const upperAddr=(address||'').toUpperCase();
    if(upperAddr!=='DB2' && upperAddr!=='DSNREXX') return null;
    const trimmed=cmd.trim();
    const m0=trimmed.match(/^EXECSQL\s+(.*)$/is);
    if(!m0) return {rc:12, output:['UNKNOWN DB2 COMMAND: ' + cmd]};
    let sql=m0[1].trim();
    let m = sql.match(/^DECLARE\s+([A-Za-z_][A-Za-z0-9_]*)\s+CURSOR\s+FOR\s+(.*)$/is);
    if(m){ rexx.cursors[m[1].toUpperCase()] = {sql:m[2], rows:null, pos:0, open:false}; return {rc:0, output:[], setVars:{SQLCODE:0}}; }
    m = sql.match(/^OPEN\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i);
    if(m){
      const cur = rexx.cursors[m[1].toUpperCase()];
      if(!cur) return {rc:-518, output:['CURSOR NOT DECLARED'], setVars:{SQLCODE:-518}};
      const res = db2engine.execute(cur.sql);
      if(res.sqlcode<0) return {rc:res.sqlcode, output:[res.message], setVars:{SQLCODE:res.sqlcode}};
      cur.rows=res.rows||[]; cur.columns=res.columns||[]; cur.pos=0; cur.open=true;
      return {rc:0, output:[], setVars:{SQLCODE:0}};
    }
    m = sql.match(/^FETCH\s+([A-Za-z_][A-Za-z0-9_]*)\s+INTO\s+(.*)$/is);
    if(m){
      const cur = rexx.cursors[m[1].toUpperCase()];
      const hostVars = m[2].split(',').map(s=>s.trim().replace(/^:/,''));
      if(!cur || !cur.open) return {rc:-501, output:['CURSOR NOT OPEN'], setVars:{SQLCODE:-501}};
      if(cur.pos>=cur.rows.length) return {rc:100, output:[], setVars:{SQLCODE:100}};
      const row=cur.rows[cur.pos++];
      const setVars={SQLCODE:0};
      hostVars.forEach((hv,i)=>{ setVars[hv]=row[cur.columns[i]]; });
      return {rc:0, output:[], setVars};
    }
    m = sql.match(/^CLOSE\s+([A-Za-z_][A-Za-z0-9_]*)\s*$/i);
    if(m){ const cur=rexx.cursors[m[1].toUpperCase()]; if(cur) cur.open=false; return {rc:0, output:[], setVars:{SQLCODE:0}}; }
    m = sql.match(/^SELECT\s+(.*?)\s+INTO\s+(.*?)\s+FROM\s+(.*)$/is);
    if(m){
      const hostVars = m[2].split(',').map(s=>s.trim().replace(/^:/,''));
      const rebuilt = 'SELECT ' + m[1] + ' FROM ' + m[3];
      const res = db2engine.execute(rebuilt);
      if(res.sqlcode<0) return {rc:res.sqlcode, output:[res.message], setVars:{SQLCODE:res.sqlcode}};
      if(!res.rows || res.rows.length===0) return {rc:100, output:[], setVars:{SQLCODE:100}};
      if(res.rows.length>1) return {rc:-811, output:['RESULT OF SELECT INTO IS MORE THAN ONE ROW'], setVars:{SQLCODE:-811}};
      const row=res.rows[0]; const setVars={SQLCODE:0};
      hostVars.forEach((hv,i)=>{ setVars[hv]=row[res.columns[i]]; });
      return {rc:0, output:[], setVars};
    }
    const res = db2engine.execute(sql);
    return {rc:res.sqlcode, output: res.sqlcode<0? [res.message]:[], setVars:{SQLCODE:res.sqlcode}};
  };
}

function hostCommandHandler(cmd, address, rexx){

// ADDRESS ISPEXEC handler: a real (subset) bridge into the shared ISPF
// variable pool used by the PANELS runtime (option 9). VGET/VPUT move
// values between REXX variables and the shared pool, exactly like real
// ISPF dialogs. DISPLAY PANEL cannot block a running exec for live input
// in this synchronous interpreter, so it renders a read-only text preview
// of the panel (labels + current pool values) into SAY-style output --
// documented as such. For a fully interactive panel, run it from option 9.
function ispexecHostCommandHandler(cmd, address, rexx){
  const trimmed = cmd.trim();
  const upper = trimmed.toUpperCase();
  let m;
  m = trimmed.match(/^VGET\s*\(\s*([^)]*)\)/i) || trimmed.match(/^VGET\s+(.+)$/i);
  if(m){
    const names = m[1].split(/[\s,]+/).filter(Boolean);
    names.forEach(nm=>{ rexx.vars[nm.toUpperCase()] = ISPF_POOL[nm.toUpperCase()]!==undefined? ISPF_POOL[nm.toUpperCase()] : ''; });
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^VPUT\s*\(\s*([^)]*)\)/i) || trimmed.match(/^VPUT\s+(.+)$/i);
  if(m){
    const names = m[1].split(/[\s,]+/).filter(Boolean);
    names.forEach(nm=>{ ISPF_POOL[nm.toUpperCase()] = rexx.lookupVar(nm); });
    saveState();
    return {rc:0, output:[]};
  }
  m = upper.match(/^DISPLAY\s+PANEL\s*\(\s*([A-Za-z0-9_$#@]+)\s*\)/);
  if(m){
    const panelName = m[1].toUpperCase();
    const mem = MEMBERS[panelName];
    if(!mem || mem.type!=='PANEL') return {rc:20, output:['ISPS021 PANEL ' + panelName + ' NOT FOUND'], setVars:{'.MSG':''}};
    const parsed = parsePanel(mem.content);
    const out = ['---------------------------- ' + panelName + ' (READ-ONLY PREVIEW) ----------------------------'];
    parsed.body.forEach(row=>{ out.push(renderPanelRowPlain(row)); });
    out.push('---------------------------------------------------------------------------------------');
    out.push('(ADDRESS ISPEXEC DISPLAY PANEL renders a read-only snapshot -- an exec cannot');
    out.push('collect live input this way. Run this panel interactively from option 9, PANELS.)');
    logActivity('PANEL PREVIEW', panelName + ' (from REXX)');
    return {rc:0, output: out};
  }
  // ISPF table services -- an in-memory, persistent subset (TBCREATE/
  // TBOPEN/TBADD/TBGET/TBTOP/TBSKIP/TBBOTTOM/TBCLOSE/TBQUERY). Column
  // values move to/from the shared ISPF_POOL, exactly like real ISPF:
  // VPUT your row's values first, then TBADD; after TBGET/TBSKIP/TBTOP/
  // TBBOTTOM, VGET the columns back out.
  m = trimmed.match(/^TBCREATE\s+([A-Za-z0-9_$#@]+)(.*)$/i);
  if(m){
    const name = m[1].toUpperCase();
    const optText = m[2];
    const replace = /\bREPLACE\b/i.test(optText);
    if(ISPF_TABLES[name] && !replace) return {rc:8, output:['ISPS106 TABLE ' + name + ' ALREADY EXISTS'], setVars:{'.MSG':''}};
    const keysM = optText.match(/KEYS\s*\(([^)]*)\)/i);
    const namesM = optText.match(/NAMES\s*\(([^)]*)\)/i);
    const keys = keysM? keysM[1].trim().split(/\s+/).filter(Boolean).map(s=>s.toUpperCase()) : [];
    const names = namesM? namesM[1].trim().split(/\s+/).filter(Boolean).map(s=>s.toUpperCase()) : [];
    ISPF_TABLES[name] = {keys, names, rows:[], crp:-1, open:true};
    saveState();
    logActivity('TABLE CREATE', name);
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TBOPEN\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const name = m[1].toUpperCase();
    if(!ISPF_TABLES[name]) return {rc:8, output:['ISPS105 TABLE ' + name + ' NOT FOUND'], setVars:{'.MSG':''}};
    ISPF_TABLES[name].open = true;
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TBADD\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const tbl = ISPF_TABLES[m[1].toUpperCase()];
    if(!tbl) return {rc:8, output:['ISPS105 TABLE NOT FOUND'], setVars:{'.MSG':''}};
    const row = {};
    tbl.keys.concat(tbl.names).forEach(col=>{ row[col] = ISPF_POOL[col]!==undefined? ISPF_POOL[col] : ''; });
    tbl.rows.push(row);
    tbl.crp = tbl.rows.length - 1;
    saveState();
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TB(TOP|BOTTOM)\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const tbl = ISPF_TABLES[m[2].toUpperCase()];
    if(!tbl) return {rc:8, output:['ISPS105 TABLE NOT FOUND'], setVars:{'.MSG':''}};
    tbl.crp = m[1].toUpperCase()==='TOP' ? 0 : tbl.rows.length-1;
    if(tbl.rows.length===0) return {rc:8, output:['ISPS100 TABLE IS EMPTY'], setVars:{'.MSG':''}};
    const row = tbl.rows[tbl.crp];
    tbl.keys.concat(tbl.names).forEach(col=> ISPF_POOL[col]=row[col]);
    saveState();
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TBSKIP\s+([A-Za-z0-9_$#@]+)(.*)$/i);
  if(m){
    const tbl = ISPF_TABLES[m[1].toUpperCase()];
    if(!tbl) return {rc:8, output:['ISPS105 TABLE NOT FOUND'], setVars:{'.MSG':''}};
    const numM = m[2].match(/NUMBER\s*\(\s*(-?\d+)\s*\)/i);
    const n = numM? parseInt(numM[1],10) : 1;
    const next = (tbl.crp<0? 0 : tbl.crp) + n;
    if(next<0 || next>=tbl.rows.length){ tbl.crp = next<0? -1 : tbl.rows.length; return {rc:8, output:['ISPS101 END OF TABLE'], setVars:{'.MSG':''}}; }
    tbl.crp = next;
    const row = tbl.rows[tbl.crp];
    tbl.keys.concat(tbl.names).forEach(col=> ISPF_POOL[col]=row[col]);
    saveState();
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TBGET\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const tbl = ISPF_TABLES[m[1].toUpperCase()];
    if(!tbl) return {rc:8, output:['ISPS105 TABLE NOT FOUND'], setVars:{'.MSG':''}};
    if(tbl.crp<0 || tbl.crp>=tbl.rows.length) return {rc:8, output:['ISPS102 NO CURRENT ROW'], setVars:{'.MSG':''}};
    const row = tbl.rows[tbl.crp];
    tbl.keys.concat(tbl.names).forEach(col=> ISPF_POOL[col]=row[col]);
    return {rc:0, output:[]};
  }
  m = trimmed.match(/^TBQUERY\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const tbl = ISPF_TABLES[m[1].toUpperCase()];
    if(!tbl) return {rc:8, output:['ISPS105 TABLE NOT FOUND'], setVars:{'.MSG':''}};
    ISPF_POOL['ZTDROWS'] = tbl.rows.length;
    return {rc:0, output:[], setVars:{'ZTDROWS': tbl.rows.length}};
  }
  m = trimmed.match(/^TBCLOSE\s+([A-Za-z0-9_$#@]+)/i);
  if(m){
    const tbl = ISPF_TABLES[m[1].toUpperCase()];
    if(tbl) tbl.open = false;
    saveState();
    return {rc:0, output:[]};
  }
  if(upper.startsWith('SETMSG')) return {rc:0, output:[]};
  if(upper.startsWith('CONTROL')) return {rc:0, output:[]};
  if(upper.startsWith('LIBDEF')) return {rc:0, output:[]};
  return {rc:20, output:['ISPS013 UNSUPPORTED ISPEXEC SERVICE: ' + cmd]};
}

// edited, panels run, datasets touched). This is separate from the data
// itself (members/datasets/tables) and is what makes the terminal feel
// like it "remembers" your session history, not just your files.

  ACTIVITY_LOG.push({ts: new Date().toISOString(), screen: STATE.screen, kind, detail: detail||''});
  if(ACTIVITY_LOG.length > ACTIVITY_LOG_MAX) ACTIVITY_LOG.splice(0, ACTIVITY_LOG.length - ACTIVITY_LOG_MAX);
}

// ---------------------------------------------------------------------
// FOLDER CONNECTION (File System Access API - Chrome/Edge/Chromium only)
// Optional, strictly-better storage tier: pick a real folder on disk and
// every save writes a real, human-readable mf3270-session.json file into
// it -- no export/import needed, and you can point a new browser/laptop
// at that same folder (e.g. if it's in Dropbox/OneDrive/a synced drive)
// to pick up right where you left off. The folder handle is remembered
// in IndexedDB; browsers require a fresh click to re-grant permission on
// a later visit (they won't silently hand out disk access), so that one
// step -- typing RECONNECT -- can't be fully automatic, but the folder
// itself, once granted, is used automatically for the rest of that visit.
// Falls back cleanly to localStorage (see below) when unsupported/unused.
// ---------------------------------------------------------------------
const IDB_NAME = 'mf3270-fsa';
const IDB_STORE = 'handles';
const SESSION_FILENAME = 'mf3270-session.json';
const FSA_SUPPORTED = typeof window !== 'undefined' && !!window.showDirectoryPicker;
let DIR_HANDLE = null;
let PENDING_RECONNECT_HANDLE = null;
let PENDING_RECONNECT_NAME = null;

function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function writeFolderSession(){
  if(!DIR_HANDLE) return;
  try{
    const fileHandle = await DIR_HANDLE.getFileHandle(SESSION_FILENAME, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(currentSessionBlob(), null, 2));
    await writable.close();
  }catch(e){ console.error('folder write failed', e); }
}
async function readFolderSession(){
  if(!DIR_HANDLE) return null;
  try{
    const fileHandle = await DIR_HANDLE.getFileHandle(SESSION_FILENAME, {create:false});
    const file = await fileHandle.getFile();
    return JSON.parse(await file.text());
  }catch(e){ return null; }
}
async function connectFolder(){
  if(!FSA_SUPPORTED){
    appendResultScreen('CONNECT FOLDER', [
      {text:'This browser does not support folder access (the File System Access API).', cls:'amber'},
      {text:'On desktop that means Chrome, Edge, or another Chromium browser, not Firefox/Safari.'},
      {text:'On mobile, no browser supports it yet (including Chrome for Android) -- there'},
      {text:'is no system folder picker it can hook into.'},
      {text:'Your session will keep saving to this device\'s local storage instead, which'},
      {text:'persists across closing/reopening the app. Use EXPORT / IMPORT to move a'},
      {text:'session to another device.'},
    ]);
    return;
  }
  let handle;
  try{ handle = await window.showDirectoryPicker({mode:'readwrite'}); }
  catch(e){
    if(e && e.name === 'AbortError') return; // user cancelled the picker, no message needed
    appendResultScreen('CONNECT FOLDER FAILED', [{text:'Could not connect: ' + e.message, cls:'red'}]);
    return;
  }
  DIR_HANDLE = handle;
  try{ await idbSet('sessionDir', handle); }catch(e){ /* ignore - still works for this visit */ }
  const blob = await readFolderSession();
  if(blob) applySessionBlob(blob); else await writeFolderSession();
  PENDING_RECONNECT_HANDLE = null;
  logActivity('FOLDER CONNECT', handle.name);
  appendResultScreen('FOLDER CONNECTED', [
    {text:'Connected to folder: ' + handle.name, cls:'green'},
    {text:''},
    {text:(blob? 'Loaded an existing session from ' : 'Created a new ') + SESSION_FILENAME + ' in that folder.'},
    {text:'From now on, everything you do saves there in real time.'},
    {text:'Point another Chrome/Edge browser at the same folder (e.g. a synced'},
    {text:'Dropbox/OneDrive folder) and CONNECT there too to share this session.'},
  ]);
}
async function disconnectFolder(){
  DIR_HANDLE = null;
  try{ await idbDelete('sessionDir'); }catch(e){}
  appendResultScreen('FOLDER DISCONNECTED', [{text:'Back to saving in this browser\'s local storage only.'}]);
}
async function tryReconnectStoredFolder(){
  if(!FSA_SUPPORTED) return false;
  let handle;
  try{ handle = await idbGet('sessionDir'); }catch(e){ return false; }
  if(!handle) return false;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ DIR_HANDLE = handle; return true; }
    PENDING_RECONNECT_HANDLE = handle;
    PENDING_RECONNECT_NAME = handle.name;
    return false;
  }catch(e){ return false; }
}
async function reconnectPending(){
  if(!PENDING_RECONNECT_HANDLE){ appendResultScreen('RECONNECT', [{text:'No previously connected folder to reconnect to.'}]); return; }
  const handle = PENDING_RECONNECT_HANDLE;
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ appendResultScreen('RECONNECT', [{text:'Permission was not granted.'}]); return; }
    DIR_HANDLE = handle;
    PENDING_RECONNECT_HANDLE = null;
    const blob = await readFolderSession();
    if(blob) applySessionBlob(blob);
    appendResultScreen('FOLDER RECONNECTED', [{text:'Reconnected to folder: ' + handle.name, cls:'green'}, {text:'Session restored from ' + SESSION_FILENAME + '.'}]);
  }catch(e){
    appendResultScreen('RECONNECT FAILED', [{text:e.message, cls:'red'}]);
  }
}

// ---------------------------------------------------------------------
// PERSISTENCE
// Three tiers, in priority order:
//   1. Connected folder (see above) -- real files on disk, if you've
//      used CONNECT. Most durable and the only one that's inspectable
//      and shareable between browsers/machines without a manual step.
//   2. Browser localStorage, under one key holding the whole session.
//      Automatic, no setup, but tied to this one browser profile/machine.
//   3. The artifact key-value storage API, when running inside Claude.ai --
//      a best-effort mirror so state also follows your Claude account.
// EXPORT / IMPORT (a downloadable .json snapshot) remain available as a
// manual fallback that works everywhere, with none of the above.
// ---------------------------------------------------------------------
const LS_KEY = 'mf3270_desktop_session_v1';

function currentSessionBlob(){
  return {
    savedAt: new Date().toISOString(),
    members: MEMBERS,
    datasets: DATASETS,
    tables: TABLES,
    jobCounter: STATE.jobCounter,
    ispfPool: ISPF_POOL,
    ispfTables: ISPF_TABLES,
    cmdHistory: CMD_HISTORY,
    activityLog: ACTIVITY_LOG,
  };
}
function applySessionBlob(blob){
  MEMBERS = blob.members || JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
  DATASETS = blob.datasets || JSON.parse(JSON.stringify(DEFAULT_DATASETS));
  TABLES = blob.tables || JSON.parse(JSON.stringify(DEFAULT_TABLES));
  db2.tables = TABLES;
  STATE.jobCounter = blob.jobCounter || 1000;
  ISPF_POOL = blob.ispfPool || {};
  ISPF_TABLES = blob.ispfTables || {};
  CMD_HISTORY = blob.cmdHistory || [];
  ACTIVITY_LOG = blob.activityLog || [];
}
function safeParse(str, fallback){ try{ return JSON.parse(str); }catch(e){ return JSON.parse(JSON.stringify(fallback)); } }

async function loadState(){
  const folderReconnected = await tryReconnectStoredFolder();
  if(folderReconnected){
    const blob = await readFolderSession();
    if(blob) applySessionBlob(blob); else { applySessionBlob({}); await writeFolderSession(); }
    return;
  }
  // Not on a connected folder (not supported, never connected, or this
  // browser needs a fresh RECONNECT click) -- fall back to localStorage.
  let fromLocal = null;
  try{
    const raw = window.localStorage && window.localStorage.getItem(LS_KEY);
    if(raw) fromLocal = safeParse(raw, null);
  }catch(e){ /* localStorage unavailable (e.g. private mode) - fall through */ }

  if(fromLocal){
    applySessionBlob(fromLocal);
    return;
  }

  // No local copy yet -- try to migrate from the older Claude.ai-only
  // artifact storage (used by earlier versions of this tool), then seed
  // defaults if that's empty too.
  if(!window.storage){
    applySessionBlob({});
    saveState();
    return;
  }
  const p1 = window.storage.get('mf3270:members', false).then(r=>r&&r.value).catch(()=>null);
  const p2 = window.storage.get('mf3270:datasets', false).then(r=>r&&r.value).catch(()=>null);
  const [m,d] = await Promise.all([p1,p2]);
  applySessionBlob({
    members: m ? safeParse(m, DEFAULT_MEMBERS) : JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),
    datasets: d ? safeParse(d, DEFAULT_DATASETS) : JSON.parse(JSON.stringify(DEFAULT_DATASETS)),
    tables: JSON.parse(JSON.stringify(DEFAULT_TABLES)),
  });
  saveState();
}

function saveState(){
  const blob = currentSessionBlob();
  const json = JSON.stringify(blob);
  try{ window.localStorage && window.localStorage.setItem(LS_KEY, json); }catch(e){ /* quota / private mode */ }
  if(window.storage){
    // best-effort mirror so it also follows the Claude.ai account
    window.storage.set('mf3270:session', json, false).catch(()=>{});
  }
  if(DIR_HANDLE){
    // best-effort real-file write; fire-and-forget so typing stays snappy
    writeFolderSession().catch(()=>{});
  }
}
// Kept as distinct names (called throughout the app after each mutation)
// but they all just persist the whole session now.
function saveMembers(){ saveState(); }
function saveDatasets(){ saveState(); }
function saveTables(){ saveState(); }

function exportSession(){
  const blob = currentSessionBlob();
  const json = JSON.stringify(blob, null, 2);
  const file = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  a.href = url;
  a.download = 'mf3270-session-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function importSessionFromFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const blob = JSON.parse(reader.result);
      if(!blob || typeof blob !== 'object') throw new Error('not a session file');
      applySessionBlob(blob);
      saveState();
      appendResultScreen('IMPORT', [
        {text:'Session imported successfully.'},
        {text:'Members: ' + Object.keys(MEMBERS).length + '   Datasets: ' + Object.keys(DATASETS).length + '   DB2 tables: ' + Object.keys(TABLES).length},
      ]);
    }catch(e){
      appendResultScreen('IMPORT FAILED', [{text:'Could not read that file as a session export: ' + e.message, cls:'red'}]);
    }
  };
  reader.onerror = () => appendResultScreen('IMPORT FAILED', [{text:'Could not read the selected file.', cls:'red'}]);
  reader.readAsText(file);
}

// ---------------------------------------------------------------------
// DOWNLOAD / UPLOAD -- move a single member or dataset's content to/from
// a plain .txt file on real disk, distinct from EXPORT/IMPORT above
// (which snapshot the *whole* session as one .json file). DOWNLOAD uses
// showSaveFilePicker so you choose exactly where it goes, when the
// browser supports it (falls back to a normal browser download
// otherwise); UPLOAD reads a local .txt file's content straight into a
// member or dataset (creating it if it doesn't exist yet).
// ---------------------------------------------------------------------
async function downloadContent(name, content, suggestedName, notify){
  notify = notify || ((msg, cls) => appendResultScreen('DOWNLOAD', [{text: msg, cls}]));
  logActivity('DOWNLOAD', name);
  if(window.showSaveFilePicker){
    let handle;
    try{
      handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{description: 'Text file', accept: {'text/plain': ['.txt']}}],
      });
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled the picker
      notify('Download failed: ' + e.message, 'red');
      return;
    }
    try{
      const writable = await handle.createWritable();
      await writable.write(content);
      await writable.close();
      notify(name + ' saved as ' + handle.name + '.', 'green');
    }catch(e){
      notify('Download failed: ' + e.message, 'red');
    }
    return;
  }
  // Fallback for browsers without a save-location picker (e.g. Firefox):
  // a normal browser download to the default Downloads folder.
  const blob = new Blob([content], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = suggestedName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  notify(name + ' downloaded as ' + suggestedName + ' (this browser can\'t choose a folder, so it went to your default Downloads location).', 'green');
}
function doDownload(name){
  if(!name){ appendResultScreen('DOWNLOAD', [{text:'Usage: DOWNLOAD <member-or-dataset-name>'}]); return; }
  if(MEMBERS[name]){ downloadContent(name, MEMBERS[name].content, name + '.txt'); return; }
  if(DATASETS[name]){ downloadContent(name, DATASETS[name].records.join('\n'), name.replace(/[^A-Za-z0-9_.-]/g,'_') + '.txt'); return; }
  appendResultScreen('DOWNLOAD', [{text:'Not found (checked members and datasets): ' + name}]);
}

let PENDING_UPLOAD = null; // {name, kind:'member'|'dataset'|'editarea', type}
function doUpload(name, kindHint){
  if(!name){
    appendResultScreen('UPLOAD', [{text:'Usage: UPLOAD <name> [DATASET | REXX | JCL | TEXT | PANEL]'}, {text:'The kind is only needed the first time, to create something new;'}, {text:'uploading into an existing member/dataset overwrites it in place.'}]);
    return;
  }
  let kind, type;
  if(MEMBERS[name]){ kind = 'member'; type = MEMBERS[name].type; }
  else if(DATASETS[name]){ kind = 'dataset'; }
  else {
    const hint = (kindHint||'').toUpperCase();
    if(hint==='DATASET' || hint==='DS' || hint==='PS'){ kind = 'dataset'; }
    else if(['REXX','JCL','TEXT','PANEL'].includes(hint)){ kind = 'member'; type = hint; }
    else {
      appendResultScreen('UPLOAD', [
        {text: name + ' doesn\'t exist yet -- say what to create it as:'},
        {text: 'UPLOAD ' + name + ' DATASET'},
        {text: 'UPLOAD ' + name + ' REXX   (or JCL / TEXT / PANEL)'},
      ]);
      return;
    }
  }
  PENDING_UPLOAD = {name, kind, type};
  uploadFileInput.click();
}
uploadFileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || !PENDING_UPLOAD) return;
  const pending = PENDING_UPLOAD; PENDING_UPLOAD = null;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result).replace(/\r\n/g, '\n');
    if(pending.kind === 'editarea'){
      editArea.value = text;
      const prev = cmdInput.placeholder;
      cmdInput.placeholder = 'Loaded ' + file.name + ' into the editor -- PF3 to save';
      setTimeout(() => { if(cmdInput.placeholder.startsWith('Loaded ')) cmdInput.placeholder = prev; }, 2500);
      return;
    }
    if(pending.kind === 'dataset'){
      DATASETS[pending.name] = {records: text.split('\n')};
      saveDatasets();
      logActivity('UPLOAD', pending.name + ' -> dataset');
      appendResultScreen('UPLOAD', [{text: file.name + ' loaded into dataset ' + pending.name + ' (' + DATASETS[pending.name].records.length + ' records).', cls:'green'}]);
      return;
    }
    MEMBERS[pending.name] = {type: pending.type, content: text};
    saveMembers();
    logActivity('UPLOAD', pending.name + ' -> member (' + pending.type + ')');
    appendResultScreen('UPLOAD', [{text: file.name + ' loaded into member ' + pending.name + ' (' + pending.type + ').', cls:'green'}]);
  };
  reader.onerror = () => appendResultScreen('UPLOAD FAILED', [{text:'Could not read ' + file.name, cls:'red'}]);
  reader.readAsText(file);
});
downloadBtn.onclick = () => { cmdInput.value = 'DOWNLOAD '; cmdInput.focus(); };
uploadBtn.onclick = () => { cmdInput.value = 'UPLOAD '; cmdInput.focus(); };

function formatSqlResult(res){
  let lines=[];
  lines.push({text:'SQLCODE = ' + res.sqlcode + '   ' + res.message, cls: res.sqlcode<0?'red':(res.sqlcode>0?'amber':'green')});
  if(res.rows && res.rows.length){
    lines.push({text:''});
    const widths = res.columns.map(c=>Math.max(c.length, ...res.rows.map(r=>String(r[c]).length)));
    lines.push({text: res.columns.map((c,i)=>c.padEnd(widths[i])).join('  '), cls:'white'});
    lines.push({text: widths.map(w=>'-'.repeat(w)).join('  '), cls:'dim'});
    res.rows.forEach(r=> lines.push({text: res.columns.map((c,i)=>String(r[c]).padEnd(widths[i])).join('  ')}));
  }
  return lines;
}

// =====================================================================
// --------------------------- ISPF PANELS --------------------------------
// A real (subset) ISPF Dialog Manager: panels are members of type PANEL,
// authored with the same )ATTR/)BODY/)INIT/)PROC/)END section structure
// as genuine ISPF panels, edited in the same member editor as REXX/JCL.
// _NAME(len) is an input field, #NAME(len) is a protected/output field,
// %word is a styled label -- all bound to a single shared ISPF variable
// pool (ISPF_POOL), just like real ISPF's screen variable pool. )INIT
// seeds defaults for unset pool variables; )PROC runs on ENTER (VER()
// validation, simple assignment, IF..THEN..=, and an optional &ZSEL
// assignment that chains straight into another command, exec, or panel --
// the same pattern real ISPF selection panels use for their menus.
// =====================================================================
function parsePanelBodyLine(line){
  const segs=[]; let i=0; const n=line.length;
  const sigilRe = /^([_#%])([A-Za-z_][A-Za-z0-9_]*)(?:\((\d+)\))?/;
  while(i<n){
    const c=line[i];
    if((c==='_'||c==='#'||c==='%') && /[A-Za-z_]/.test(line[i+1]||'')){
      const mm = line.slice(i).match(sigilRe);
      if(mm){
        const sigil=mm[1], name=mm[2].toUpperCase(), len=mm[3]?parseInt(mm[3],10):null;
        if(sigil==='_') segs.push({type:'input', name, len: len||Math.max(8,name.length)});
        else if(sigil==='#') segs.push({type:'protected', name, len: len||Math.max(8,name.length)});
        else segs.push({type:'label', text: mm[2]});
        i += mm[0].length;
        continue;
      }
    }
    let j=i+1;
    while(j<n){ const cj=line[j]; if((cj==='_'||cj==='#'||cj==='%') && /[A-Za-z_]/.test(line[j+1]||'')) break; j++; }
    segs.push({type:'text', text: line.slice(i,j)});
    i=j;
  }
  return segs;
}
function parsePanelStmts(lines){
  const stmts=[];
  for(let i=0;i<lines.length;i++){
    const t = lines[i].trim();
    if(!t || t.startsWith('*')) continue;
    let m;
    m = t.match(/^VER\s*\(\s*&?([A-Za-z_][A-Za-z0-9_]*)\s*,\s*([A-Za-z]+)\s*\)\s*$/i);
    if(m){ stmts.push({type:'ver', name:m[1].toUpperCase(), rule:m[2].toUpperCase()}); continue; }
    m = t.match(/^IF\s+&?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*'([^']*)'\s+THEN\s+&?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/i);
    if(m){
      const stmt = {type:'ifassign', condName:m[1].toUpperCase(), condVal:m[2], name:m[3].toUpperCase(), valueExpr:m[4].trim(), elseName:null, elseExpr:null};
      const next = (lines[i+1]||'').trim();
      const em = next.match(/^ELSE\s+&?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/i);
      if(em){ stmt.elseName = em[1].toUpperCase(); stmt.elseExpr = em[2].trim(); i++; }
      stmts.push(stmt);
      continue;
    }
    m = t.match(/^&?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+)$/);
    if(m){ stmts.push({type:'assign', name:m[1].toUpperCase(), valueExpr:m[2].trim()}); continue; }
  }
  return stmts;
}
function parsePanel(source){
  const lines = source.replace(/\r\n/g,'\n').split('\n');
  const sections = {ATTR:[], BODY:[], INIT:[], PROC:[]};
  let cur=null;
  for(const raw of lines){
    const t = raw.trim();
    const secMatch = t.match(/^\)(ATTR|BODY|INIT|PROC|END)\b/i);
    if(secMatch){ const s=secMatch[1].toUpperCase(); cur = s==='END'? null : s; continue; }
    if(cur && sections[cur]) sections[cur].push(raw);
  }
  return {
    body: sections.BODY.map(parsePanelBodyLine),
    initStmts: parsePanelStmts(sections.INIT),
    procStmts: parsePanelStmts(sections.PROC),
  };
}
function resolvePanelExpr(expr, pool){
  expr = expr.trim();
  const qm = expr.match(/^'(.*)'$/);
  if(qm) return qm[1].replace(/''/g,"'");
  if(expr.startsWith('&')) return pool[expr.slice(1).toUpperCase()] || '';
  return expr;
}
function runPanelStmts(stmts, pool, opts){
  opts = opts || {};
  let msg=null;
  for(const st of stmts){
    if(st.type==='assign'){
      if(opts.onlyIfUnset){ if(pool[st.name]===undefined || pool[st.name]==='') pool[st.name]=resolvePanelExpr(st.valueExpr,pool); }
      else pool[st.name]=resolvePanelExpr(st.valueExpr,pool);
    } else if(st.type==='ifassign'){
      if(String(pool[st.condName]||'')===st.condVal) pool[st.name]=resolvePanelExpr(st.valueExpr,pool);
      else if(st.elseName) pool[st.elseName]=resolvePanelExpr(st.elseExpr,pool);
    } else if(st.type==='ver'){
      const val = pool[st.name]!==undefined? String(pool[st.name]):'';
      if(st.rule==='NB' && val.trim()===''){ msg = st.name + ' must not be blank.'; break; }
      if(st.rule==='NUM' && (val.trim()===''||isNaN(Number(val)))){ msg = st.name + ' must be numeric.'; break; }
    }
  }
  return {msg};
}
function renderPanelRowPlain(segs){
  return segs.map(s=>{
    if(s.type==='text') return s.text;
    if(s.type==='label') return s.text;
    if(s.type==='input' || s.type==='protected'){
      const v = ISPF_POOL[s.name]!==undefined? String(ISPF_POOL[s.name]) : '';
      return v.padEnd(s.len);
    }
    return '';
  }).join('');
}

function showPanelRun(panelName, opts){
  const mem = MEMBERS[panelName];
  if(!mem || mem.type!=='PANEL'){ appendResultScreen('PANEL', [{text:'Panel not found: ' + panelName}]); return; }
  let parsed;
  try{ parsed = parsePanel(mem.content); }
  catch(e){ appendResultScreen('PANEL ERROR', [{text:'Could not parse panel ' + panelName + ': ' + e.message, cls:'red'}]); return; }
  // If another panel is already active and this isn't a stack pop (PF3
  // returning to a caller), remember it so PF3 from the new panel comes
  // back here -- the same nesting real ISPF gets from chained DISPLAYs.
  if(PANEL_RUNTIME && !(opts && opts.isPop)) PANEL_STACK.push(PANEL_RUNTIME.panelName);
  runPanelStmts(parsed.initStmts, ISPF_POOL, {onlyIfUnset:true});
  PANEL_RUNTIME = {panelName, parsed};
  STATE.screen='panelrun';
  STATE.panelMsg = null;
  logActivity('PANEL DISPLAY', panelName);
  renderPanelScreen();
}

function renderPanelScreen(){
  const {panelName, parsed} = PANEL_RUNTIME;
  let h='';
  h += line(panelName + '  ' + '-'.repeat(Math.max(0,50-panelName.length)) + '  ISPF PANEL','white');
  if(STATE.panelMsg) h += line('  *** ' + STATE.panelMsg + ' ***','red');
  h += line('','');
  const inputNames=[];
  parsed.body.forEach(segs=>{
    let rowHtml='';
    segs.forEach(s=>{
      if(s.type==='text') rowHtml += esc(s.text);
      else if(s.type==='label') rowHtml += '<span class="white">'+esc(s.text)+'</span>';
      else if(s.type==='protected'){
        const v = ISPF_POOL[s.name]!==undefined? String(ISPF_POOL[s.name]):'';
        rowHtml += '<span class="blue">'+esc(v.padEnd(s.len))+'</span>';
      } else if(s.type==='input'){
        inputNames.push(s.name);
        const v = ISPF_POOL[s.name]!==undefined? String(ISPF_POOL[s.name]):'';
        rowHtml += '<input type="text" id="ispf_f_'+esc(s.name)+'" data-fld="'+esc(s.name)+'" maxlength="'+s.len+'" size="'+s.len+'" value="'+esc(v)+'" class="ispf-field" autocomplete="off" spellcheck="false">';
      }
    });
    h += '<div>' + (rowHtml || '&nbsp;') + '</div>';
  });
  setScreen(h);
  inputNames.forEach((nm,idx)=>{
    const el = document.getElementById('ispf_f_'+nm);
    if(!el) return;
    el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submitPanel(); } });
    if(idx===0) setTimeout(()=>el.focus(), 0);
  });
  setPF([{label:'ENTER', cmd:'__PANEL_ENTER__'},{label:'PF3 CANCEL', cmd:'__PANEL_CANCEL__'},{label:'PF12 CANCEL', cmd:'__PANEL_CANCEL__'}]);
  cmdInput.placeholder='ENTER to submit, PF3/PF12 to cancel (Tab moves between fields)';
}
function collectPanelFieldValues(){
  PANEL_RUNTIME.parsed.body.forEach(segs=>segs.forEach(s=>{
    if(s.type==='input'){
      const el = document.getElementById('ispf_f_'+s.name);
      if(el) ISPF_POOL[s.name] = el.value;
    }
  }));
}
function submitPanel(){
  if(!PANEL_RUNTIME) return;
  collectPanelFieldValues();
  const {panelName, parsed} = PANEL_RUNTIME;
  const res = runPanelStmts(parsed.procStmts, ISPF_POOL, {});
  if(res.msg){ STATE.panelMsg = res.msg; renderPanelScreen(); return; }
  STATE.panelMsg = null;
  saveState();
  logActivity('PANEL SUBMIT', panelName);
  const zsel = ISPF_POOL['ZSEL'];
  if(zsel){
    delete ISPF_POOL['ZSEL'];
    saveState();
    const zselVerb = zsel.trim().split(/\s+/)[0].toUpperCase();
    // Only remember this panel as "caller" when chaining to another panel
    // -- pushing it for an EX/SUB target would leave a stale stack entry
    // that later, unrelated panel cancels could wrongly "return" to. Push
    // before nulling PANEL_RUNTIME (showPanelRun's own auto-push needs it
    // set to detect nesting, but by the time it runs here it's already
    // gone, so this transition has to record it manually).
    if(zselVerb==='R') PANEL_STACK.push(panelName);
    PANEL_RUNTIME = null;
    // Leave 'panelrun' first, or the chained command re-enters the panel
    // guard and is dropped. Route to whichever screen actually recognizes
    // the ZSEL command's verb -- "R panelname" only works from 'panels',
    // everything else (EX/SUB/...) works from 'menu'.
    STATE.screen = (zselVerb==='R') ? 'panels' : 'menu';
    handleCommand(zsel);
    return;
  }
  PANEL_RUNTIME = null;
  if(PANEL_STACK.length){ showPanelRun(PANEL_STACK.pop(), {isPop:true}); return; }
  appendResultScreen('PANEL ' + panelName + ' SUBMITTED', [
    {text:'Field values captured into the shared ISPF variable pool.'},
    {text:'Type POOL from the PANELS option to inspect them.'},
  ]);
}
function cancelPanel(){
  logActivity('PANEL CANCEL', PANEL_RUNTIME? PANEL_RUNTIME.panelName : '');
  PANEL_RUNTIME = null;
  if(PANEL_STACK.length){ showPanelRun(PANEL_STACK.pop(), {isPop:true}); return; }
  showPanelsList();
}

// =====================================================================
// ------------------------------- FIND -----------------------------------
// ISPF-style F/FIND <text>, usable from any screen. On the edit screen it
// searches the textarea's contents directly; everywhere else it searches
// the rendered screen text using the browser's native find-in-page engine
// (window.find), which also selects the match -- so it doubles as a way
// to land a selection for copy/paste. Repeating F/FIND with no text finds
// the next occurrence of the last search.
// =====================================================================
function flashNotFound(text){
  const prev = cmdInput.placeholder;
  cmdInput.placeholder = 'NOT FOUND: ' + text;
  setTimeout(()=>{ if(cmdInput.placeholder.startsWith('NOT FOUND:')) cmdInput.placeholder = prev; }, 1500);
}
// Real ISPF repeats a find with PF5/RFIND -- physical F5 is unreliable here
// (Chromium reserves it for page reload, same issue as F3/F11/F12), so this
// on-screen button is the dependable way to step through matches one by
// one; typing a bare F/FIND with no text does the same thing.
function updateFindNextButton(){
  if(STATE.lastFind){
    findNextBtn.setAttribute('data-label', 'PF5 NEXT: ' + (STATE.lastFind.length>16? STATE.lastFind.slice(0,16)+'…' : STATE.lastFind));
    findNextBtn.style.display = '';
  } else {
    findNextBtn.style.display = 'none';
  }
}
findNextBtn.onclick = ()=>{
  if(!STATE.lastFind) return;
  if(STATE.screen==='edit') findInEditArea(STATE.lastFind);
  else doFind(STATE.lastFind);
};
function findInEditArea(text){
  if(!text) return;
  STATE.lastFind = text;
  updateFindNextButton();
  const ta = editArea;
  const val = ta.value;
  const upperVal = val.toUpperCase();
  const upperText = text.toUpperCase();
  const startFrom = ta.selectionEnd!=null ? ta.selectionEnd : 0;
  let idx = upperVal.indexOf(upperText, startFrom);
  if(idx===-1) idx = upperVal.indexOf(upperText, 0);
  if(idx===-1){ flashNotFound(text); return; }
  ta.focus();
  ta.setSelectionRange(idx, idx + text.length);
}
function doFind(text){
  if(!text) text = STATE.lastFind;
  if(!text){ appendResultScreen('FIND', [{text:'Usage: F <text>  (repeats the last search if text is omitted)'}]); return; }
  STATE.lastFind = text;
  updateFindNextButton();
  logActivity('FIND', text);
  let ok = false;
  try{ ok = !!(window.find && window.find(text, false, false, true, false, true, false)); }catch(e){ ok = false; }
  if(!ok) flashNotFound(text);
}
